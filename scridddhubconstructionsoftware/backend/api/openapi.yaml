components:
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LandParcelId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PacketId:
      name: packetID
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    NearbyRegisteredTransactions:
      type: object
      required: [items, months, six_month_count, count, radius_km, match_basis, median_rate_per_acre, min_rate_per_acre, max_rate_per_acre, coverage]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RegisteredTransaction" }
        months: { type: integer, enum: [6, 12] }
        six_month_count: { type: integer }
        count: { type: integer }
        radius_km: { type: number }
        match_basis: { type: string, enum: [distance, village, unresolved] }
        median_rate_per_acre: { type: [number, "null"] }
        min_rate_per_acre: { type: [number, "null"] }
        max_rate_per_acre: { type: [number, "null"] }
        coverage:
          type: [object, "null"]
          required: [status, message, searched_at]
          properties:
            status: { type: string, enum: [searching, searched, partial, failed, access_required, location_required] }
            message: { type: string }
            searched_at: { type: [string, "null"], format: date-time }
    RegisteredTransaction:
      type: object
      required: [id, registration_date, document_no, office_name, survey_no, property_type, area_acres, sale_price_rupees, government_value_rupees, location_method, distance_km, rate_per_acre, source, source_url, source_record_id]
      properties:
        id: { type: string, format: uuid }
        registration_date: { type: string, format: date-time }
        document_no: { type: string }
        office_name: { type: string }
        survey_no: { type: string }
        property_type: { type: string, enum: [land, plot] }
        area_acres: { type: number }
        sale_price_rupees: { type: integer }
        government_value_rupees: { type: [integer, "null"] }
        location_method: { type: string }
        distance_km: { type: [number, "null"] }
        rate_per_acre: { type: number }
        source: { type: string }
        source_url: { type: string, format: uri }
        source_record_id: { type: string, format: uuid }
    Error:
      type: object
      properties:
        error:
          type: string

    LandParcelStage:
      type: string
      enum: [sourced, screened, dd, negotiating]

    CreateProjectRequest:
      type: object
      required: [org_id, name]
      properties:
        org_id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateLandParcelRequest:
      type: object
      required: [project_id, name]
      properties:
        project_id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string
        area_acres:
          type: number
          nullable: true
          description: Required whenever cost_rupees is set (enforced server-side); optional for a price-less "just checking a location" parcel.
        cost_rupees:
          type: integer
          format: int64
          nullable: true
          description: Omitted for a "just checking a location" parcel with no asking price yet.
        fsi:
          type: number
          nullable: true
        source:
          type: string
          nullable: true
          description: Where the builder found out about this parcel (broker, online listing, referral, field survey, ...). Free-form provenance, not a constrained enum.
        source_url:
          type: string
          nullable: true
          description: The actual listing/portal link backing up source, if there is one — makes the source a checkable fact instead of just a label.
        district:
          type: string
          nullable: true
          description: Structured location, set only when known (the "Just checking a location" flow collects this via the Ready Reckoner picker). See docs/adr/0005.
        taluka:
          type: string
          nullable: true
        village:
          type: string
          nullable: true
        notes:
          type: string
        latitude:
          type: number
          nullable: true
          description: Optional — where the parcel actually is, if pinned while adding it.
        longitude:
          type: number
          nullable: true
        location_source:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LocationSource"

    LandParcel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string
        area_acres:
          type: number
          nullable: true
        cost_rupees:
          type: integer
          format: int64
          nullable: true
        fsi:
          type: number
          nullable: true
        source:
          type: string
          nullable: true
        source_url:
          type: string
          nullable: true
        source_verified_at:
          type: string
          format: date-time
          nullable: true
          description: Set only after a real reachability check against source_url succeeded — never on creation, never guessed.
        district:
          type: string
          nullable: true
        taluka:
          type: string
          nullable: true
        village:
          type: string
          nullable: true
        survey_number:
          type: string
          nullable: true
          description: >-
            Survey/gat number(s) with hissa as written on the 7/12s, e.g. "45/2A". Land spanning
            several survey numbers lists them comma-separated: "42/3, 42/4/2".
        closed_price_rupees:
          type: integer
          format: int64
          nullable: true
          description: The real, final transacted price once a deal closes — distinct from cost_rupees (an asking price). See docs/adr/0005.
        closed_at:
          type: string
          format: date-time
          nullable: true
        stage:
          $ref: "#/components/schemas/LandParcelStage"
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        latitude:
          type: number
          nullable: true
          description: Where the parcel actually is; null until pinned.
        longitude:
          type: number
          nullable: true
        location_source:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LocationSource"
        location_set_at:
          type: string
          format: date-time
          nullable: true

    LocationSource:
      type: string
      enum: [pin, gps, maps_link, village, text]
      description: How the parcel's coordinates were obtained, most to least precise.

    PointGuess:
      type: object
      properties:
        found:
          type: boolean
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true

    ListClosedTransactionsResponse:
      type: object
      properties:
        count:
          type: integer
        transactions:
          type: array
          items:
            type: object
            properties:
              area_acres:
                type: number
              closed_price_rupees:
                type: integer
                format: int64
              closed_at:
                type: string
                format: date-time

    VerifySourceResponse:
      type: object
      required: [reachable, status_code]
      properties:
        reachable:
          type: boolean
        status_code:
          type: integer
        parcel:
          $ref: "#/components/schemas/LandParcel"

    UpsertFeasibilityAssessmentRequest:
      type: object
      required: [current_valuation_rupees, future_valuation_rupees, future_valuation_year, verdict]
      properties:
        current_valuation_rupees:
          type: integer
          format: int64
        future_valuation_rupees:
          type: integer
          format: int64
        future_valuation_year:
          type: integer
        verdict:
          type: string
        compared_parcel_id:
          type: string
          format: uuid
          nullable: true
        margin_pct:
          type: number
          nullable: true
        infrastructure_note:
          type: string
        comparable_sales_note:
          type: string

    FeasibilityAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        land_parcel_id:
          type: string
          format: uuid
        current_valuation_rupees:
          type: integer
          format: int64
        future_valuation_rupees:
          type: integer
          format: int64
        future_valuation_year:
          type: integer
        verdict:
          type: string
        compared_parcel_id:
          type: string
          format: uuid
          nullable: true
        margin_pct:
          type: number
          nullable: true
        infrastructure_note:
          type: string
        comparable_sales_note:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        current_low_rupees:
          type: integer
          format: int64
          nullable: true
          description: Low end of today's value range (Assess only); current_valuation_rupees is the likely value
        current_high_rupees:
          type: integer
          format: int64
          nullable: true
        future_low_rupees:
          type: integer
          format: int64
          nullable: true
        future_high_rupees:
          type: integer
          format: int64
          nullable: true
        method:
          type: string
          enum: [manual, ai_assessed]
        reasoning:
          type: string
        assessed_at:
          type: string
          format: date-time
          nullable: true
        basis:
          nullable: true
          description: What an Assess rested on (absent for a manual assessment)
          allOf:
            - $ref: "#/components/schemas/ValuationBasis"

    ValuationBasis:
      type: object
      properties:
        as_of:
          type: string
          format: date-time
        location:
          type: string
        area_acres:
          type: number
        pinned:
          type: boolean
        ready_reckoner_per_acre:
          type: integer
          format: int64
          nullable: true
        ready_reckoner_year:
          type: string
        nearby_sales_count:
          type: integer
