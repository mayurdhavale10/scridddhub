        parcel's free-text location is geocoded (cached); projects with located stations are matched
        by straight-line distance within radius_km, nearest first. Projects without located points
        fall back to taluka matching (match_basis says which). An empty list means nothing on the
        list is near it, not that nothing is planned.
      parameters:
        - name: parcelID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannedInfrastructureList"
        "404":
          $ref: "#/components/responses/NotFound"

