openapi: 3.1.0
info:
  title: ScridddHub API
  version: 0.1.0
  description: >
    Source of truth for the TypeScript client generated into packages/api-client.
    Covers only what's implemented so far (Level 1: Land Parcels vertical slice).
servers:
  - url: http://localhost:8080

paths:
  /land-parcels/{parcelID}/registered-transactions:
    get:
      operationId: nearbyRegisteredTransactionsForParcel
      summary: Database-first registered land sales, with on-demand coverage status
      parameters:
        - name: parcelID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sales within 3 km of the pin, or the same village; 6 months extended to 12 if sparse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NearbyRegisteredTransactions" }
        "404":
          $ref: "#/components/responses/NotFound"
  /reference/registered-transactions:
    get:
      operationId: nearbyRegisteredTransactionsForLocation
      summary: Look up sales before saving a parcel; supply a pin or district, taluka and village
      parameters:
        - { name: latitude, in: query, schema: { type: number, minimum: 15, maximum: 23 } }
        - { name: longitude, in: query, schema: { type: number, minimum: 72, maximum: 81 } }
        - { name: district, in: query, schema: { type: string } }
        - { name: taluka, in: query, schema: { type: string } }
        - { name: village, in: query, schema: { type: string } }
      responses:
        "200":
          description: Available registered land sales and source coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NearbyRegisteredTransactions" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /projects:
    post:
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"

  /projects/{id}:
    get:
      operationId: getProject
      summary: Get a project by id
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectID}/land-parcels:
    get:
      operationId: listLandParcelsByProject
      summary: List land parcels for a project
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LandParcel"

  /reference/geography/districts:
    get:
      operationId: listGeographyDistricts
      summary: All 36 real Maharashtra districts (docs/adr/0006) — from the government's own Common Village Master API, not just districts with a Ready Reckoner rate on file
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringList"

  /reference/geography/talukas:
    get:
      operationId: listGeographyTalukas
      summary: Real talukas within a district (docs/adr/0006)
      parameters:
        - name: district
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringList"

  /reference/geography/villages:
    get:
      operationId: listGeographyVillages
      summary: Real villages within a district+taluka (docs/adr/0006) — all 44,918 statewide, not just villages with a rate on file
      parameters:
        - name: district
          in: query
          required: true
          schema:
            type: string
        - name: taluka
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringList"

  /reference/geography/villages/search:
    get:
      operationId: searchGeographyVillages
      summary: Free-text village search across all 44,918 real Maharashtra villages (docs/adr/0006 follow-up) — powers a single search field instead of three cascading district/taluka/village pickers; each result carries its full district/taluka/village context
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VillageMatchList"

  /land-parcels/estimate-value/ai:
    get:
      operationId: estimateParcelValueAI
      summary: UNVERIFIED LLM-based market estimate (Groq) — never equivalent to the government-data-backed /land-parcels/estimate-value; Confidence is always "low"
      description: >-
        Always asks the LLM. If district/taluka/village name a real village with a Ready Reckoner
        rate on file, the server looks that rate up itself and gives it to the model as a floor;
        otherwise the model works from location, area, source and notes alone.
      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
        - name: area_acres
          in: query
          required: true
          schema:
            type: number
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: notes
          in: query
          required: false
          description: user's free-text notes about the plot (truncated to 1000 characters)
          schema:
            type: string
        - name: district
          in: query
          required: false
          schema:
            type: string
        - name: taluka
          in: query
          required: false
          schema:
            type: string
        - name: village
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AILandValueEstimate"

  /land-parcels/estimate-value:
    get:
      operationId: estimateParcelValue
      summary: On-demand, standalone location-based value estimate (Screen 4.2 "Estimate Value")
      description: >-
        Called only when whoever is adding a parcel doesn't already know the price — never
        automatic. Grounded entirely in this location's own government-published Ready Reckoner
        Rate (Maharashtra e-ASR); NEVER a comparison against other parcels recorded anywhere in
        this app, at any scope (see docs/adr/0004). 404s honestly if no rate is on file yet for
        this exact village, rather than fabricating a number.
      parameters:
        - name: district
          in: query
          required: true
          schema:
            type: string
        - name: taluka
          in: query
          required: true
          schema:
            type: string
        - name: village
          in: query
          required: true
          schema:
            type: string
        - name: area_acres
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationValueEstimate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /land-parcels:
    post:
      operationId: createLandParcel
      summary: Create a land parcel (Screen 4 "+" action)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLandParcelRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandParcel"
        "400":
          $ref: "#/components/responses/BadRequest"

  /land-parcels/{id}:
    get:
      operationId: getLandParcel
      summary: Get a land parcel by id (Screen 5 detail)
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandParcel"
        "404":
          $ref: "#/components/responses/NotFound"

  /land-parcels/{id}/stage:
    patch:
      operationId: updateLandParcelStage
      summary: Move a land parcel to a new pipeline stage
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  $ref: "#/components/schemas/LandParcelStage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandParcel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /land-parcels/{id}/verify-source:
    post:
      operationId: verifyLandParcelSource
      summary: On-demand reachability check against the parcel's own recorded source_url (never a content scrape; never runs automatically)
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifySourceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /land-parcels/{id}/close:
    post:
      operationId: recordLandParcelClosedPrice
      summary: Record the real, final transacted price once a deal actually closes (docs/adr/0005)
      description: >-
        Distinct from the parcel's asking price (cost_rupees), which is captured once at creation
        and never re-verified. This is the only legitimate ground truth for a future pricing
        model — see services/estimatedparcelvalue/README.md.
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [closed_price_rupees]
              properties:
                closed_price_rupees:
                  type: integer
                  format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandParcel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /land-parcels/{id}/location:
    put:
      operationId: setLandParcelLocation
      summary: Record where the parcel actually is — a pin, GPS on site, or a pasted Maps link
      description: >-
        Land has no street address, so geocoding free text is only a guess
        (docs/design/parcel-location-first-principles.md). Nearby and planned infrastructure use
        these coordinates first. Audited like every parcel change.
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude, location_source]
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
                location_source:
                  $ref: "#/components/schemas/LocationSource"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandParcel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /land-parcels/{id}/land-record:
    put:
      operationId: setLandParcelLandRecord
      summary: Record how the parcel is identified on its 7/12
      description: >-
        District, taluka, village and survey/gat number. Every land record lookup (7/12, Ferfar,
        Index-II) needs all four, so ordering a Due-Diligence Report requires them. Audited.
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [district, taluka, village, survey_number]
              properties:
                district:
                  type: string
                taluka:
                  type: string
                village:
                  type: string
                survey_number:
                  type: string
                  description: One survey number, or several comma-separated ("42/3, 42/4/2")
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandParcel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /land-parcels/{id}/seven-twelve/read:
    post:
      operationId: readSevenTwelve
      summary: Read a photo of the parcel's 7/12 into a draft (nothing is saved)
      description: >-
        The body is the photo itself. A vision model reads it; a person must check every field and
        confirm with PUT /land-parcels/{id}/seven-twelve. Warning flags are worked out by rules.
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevenTwelveDraft"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Not a readable photo
        "503":
          description: Reading isn't configured

  /land-parcels/{id}/seven-twelve/read-text:
    post:
      operationId: readSevenTwelveText
      summary: Read a 7/12 from the text of a Bhulekh page opened in the app (nothing is saved)
      description: >-
        The person opens Bhulekh inside the app and types the captcha themselves; once the record is
        on screen the app sends the page's text. Only pages from mahabhumi.gov.in are accepted. The
        result is never treated as the digitally signed copy.
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, source_url]
              properties:
                text: { type: string }
                source_url: { type: string }
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevenTwelveDraft"
        "422":
          description: Not a 7/12 page yet, or not from mahabhumi.gov.in

  /land-parcels/{id}/seven-twelve/read-pdf:
    post:
      operationId: readSevenTwelvePDF
      summary: Read a signed 7/12 PDF bought from Digital Satbara (nothing is saved)
      description: >-
        The body is the PDF as downloaded (about 85 KB). Its text layer is in a legacy font, so the
        page is rendered and read with Tesseract, then rules set the area and its unit, tenure, NA
        status and the signature's verification number. The file name Digital Satbara gives the
        download ("<village>_<survey with # for />_Satbara.pdf") supplies the exact survey number.
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
        - name: filename
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevenTwelveDraft"
        "422":
          description: Not a 7/12 PDF
        "503":
          description: Tesseract or pdftoppm isn't installed on the server

  /land-parcels/{id}/seven-twelve:
    get:
      operationId: getSevenTwelve
      summary: The parcel's confirmed 7/12s, one per survey number, read together
      description: >-
        records is empty until one is confirmed. flags include each 7/12's warnings (prefixed with
        its survey number when there are several) and the ones read across them: survey numbers
        with no 7/12 yet, every holder who must sign, and the total area against the parcel's.
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevenTwelveSet"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSevenTwelve
      summary: Remove the 7/12 saved for one survey number of the parcel
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
        - name: survey
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The remaining set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevenTwelveSet"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: confirmSevenTwelve
      summary: Save a 7/12 after a person has checked it (keyed by the survey number it shows; returns the set)
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: "#/components/schemas/SevenTwelve"
                read_by:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevenTwelveSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /land-parcels/{id}/ferfar/read:
    post:
      operationId: readFerfar
      summary: Read one photo of mutation register entries into a draft (nothing is saved)
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FerfarDraft"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Not a readable photo

  /land-parcels/{id}/ferfar:
    get:
      operationId: getFerfar
      summary: The parcel's confirmed mutation register (404 until confirmed)
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandMutations"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: confirmFerfar
      summary: Save the mutation register after a person has checked every entry
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: "#/components/schemas/MutationRegister"
                read_by:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandMutations"
        "400":
          $ref: "#/components/responses/BadRequest"

  /registered-transactions:
    post:
      operationId: recordRegisteredSale
      summary: Record one land sale typed from an Index-II copy
      description: >-
        Our team searches Index-II for a village and enters each land sale. The person entering it
        is its reviewer; non-comparable sales need a reason. Valuations then use same-village sales
        as evidence (a typical rate needs at least 3 comparable sales).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [district, taluka, village, registration_date, document_no, office_name, property_type, area_acres, sale_price_rupees, comparable]
              properties:
                district: { type: string }
                taluka: { type: string }
                village: { type: string }
                survey_no: { type: string }
                registration_date: { type: string, description: YYYY-MM-DD }
                document_no: { type: string }
                office_name: { type: string }
                property_type: { type: string, enum: [land, plot] }
                area_acres: { type: number }
                sale_price_rupees: { type: integer, format: int64 }
                government_value_rupees: { type: integer, format: int64, nullable: true }
                comparable: { type: boolean }
                exclusion_reason: { type: string }
                notes: { type: string }
      responses:
        "201":
          description: Recorded
        "400":
          $ref: "#/components/responses/BadRequest"

  /reference/location-guess:
    get:
      operationId: guessLocation
      summary: Best guess for a free-text location — where the pin starts before the user moves it
      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointGuess"
        "400":
          $ref: "#/components/responses/BadRequest"

  /reference/map-link:
    get:
      operationId: resolveMapLink
      summary: Coordinates from a pasted Google Maps link (short links are expanded)
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointGuess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: Not a Google Maps link, or the link has no pinned location in it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reference/pricing-pool/closed-transactions:
    get:
      operationId: listPooledClosedTransactions
      summary: Real closed transactions pooled across every org/project (docs/adr/0005) — not wired to any UI yet
      description: >-
        Infrastructure for a future pricing model, built ahead of having enough volume to train
        one. Deliberately anonymized (no org/project/parcel identity) and never scoped to a single
        project — see docs/adr/0005 for why.
      parameters:
        - name: district
          in: query
          required: true
          schema:
            type: string
        - name: taluka
          in: query
          required: true
          schema:
            type: string
        - name: village
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListClosedTransactionsResponse"

  /land-parcels/{parcelID}/feasibility-assessment:
    put:
      operationId: upsertFeasibilityAssessment
      summary: Set (create or replace) a parcel's feasibility assessment (Screen 5)
      parameters:
        - name: parcelID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertFeasibilityAssessmentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeasibilityAssessment"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: getFeasibilityAssessment
      summary: Get a parcel's feasibility assessment (Screen 5)
      parameters:
        - name: parcelID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeasibilityAssessment"
        "404":
          $ref: "#/components/responses/NotFound"

  /land-parcels/{parcelID}/valuation:
    post:
      operationId: assessParcelValuation
      summary: Value any saved parcel now and in 5 years, and compare with its asking price
      description: >-
        Valuation Summary "Assess" (services/valuationsummary/README.md). Uses whatever is known
        about the parcel (Ready Reckoner rate, nearby infrastructure from its pin or location,
        nearby registered sales) to get AI per-acre ranges; totals, the comparison with the
        asking price and the verdict are computed in code. Stored as the parcel's feasibility
        assessment, with a record of what it was based on. One AI call per request.
      parameters:
        - name: parcelID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeasibilityAssessment"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The parcel has no area recorded, so no total value can be given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /land-parcels/{parcelID}/planned-infrastructure:
    get:
      operationId: getPlannedInfrastructure
      summary: Approved infrastructure projects near a parcel (Screen 5)
      description: >-
