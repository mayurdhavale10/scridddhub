components:
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LandParcelId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PacketId:
      name: packetID
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    LandParcelStage:
      type: string
      enum: [sourced, screened, dd, negotiating]

    CreateProjectRequest:
      type: object
      required: [org_id, name]
      properties:
        org_id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateLandParcelRequest:
      type: object
      required: [project_id, name]
      properties:
        project_id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string
        area_acres:
          type: number
          nullable: true
          description: Required whenever cost_rupees is set (enforced server-side); optional for a price-less "just checking a location" parcel.
        cost_rupees:
          type: integer
          format: int64
          nullable: true
          description: Omitted for a "just checking a location" parcel with no asking price yet.
        fsi:
          type: number
          nullable: true
        source:
          type: string
          nullable: true
          description: Where the builder found out about this parcel (broker, online listing, referral, field survey, ...). Free-form provenance, not a constrained enum.
        source_url:
          type: string
          nullable: true
          description: The actual listing/portal link backing up source, if there is one — makes the source a checkable fact instead of just a label.
        district:
          type: string
          nullable: true
          description: Structured location, set only when known (the "Just checking a location" flow collects this via the Ready Reckoner picker). See docs/adr/0005.
        taluka:
          type: string
          nullable: true
        village:
          type: string
          nullable: true
        notes:
          type: string

    LandParcel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string
        area_acres:
          type: number
          nullable: true
        cost_rupees:
          type: integer
          format: int64
          nullable: true
        fsi:
          type: number
          nullable: true
        source:
          type: string
          nullable: true
        source_url:
          type: string
          nullable: true
        source_verified_at:
          type: string
          format: date-time
          nullable: true
          description: Set only after a real reachability check against source_url succeeded — never on creation, never guessed.
        district:
          type: string
          nullable: true
        taluka:
          type: string
          nullable: true
        village:
          type: string
          nullable: true
        closed_price_rupees:
          type: integer
          format: int64
          nullable: true
          description: The real, final transacted price once a deal closes — distinct from cost_rupees (an asking price). See docs/adr/0005.
        closed_at:
          type: string
          format: date-time
          nullable: true
        stage:
          $ref: "#/components/schemas/LandParcelStage"
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListClosedTransactionsResponse:
      type: object
      properties:
        count:
          type: integer
        transactions:
          type: array
          items:
            type: object
            properties:
              area_acres:
                type: number
              closed_price_rupees:
                type: integer
                format: int64
              closed_at:
                type: string
                format: date-time

    VerifySourceResponse:
      type: object
      required: [reachable, status_code]
      properties:
        reachable:
          type: boolean
        status_code:
          type: integer
        parcel:
          $ref: "#/components/schemas/LandParcel"

    UpsertFeasibilityAssessmentRequest:
      type: object
      required: [current_valuation_rupees, future_valuation_rupees, future_valuation_year, verdict]
      properties:
        current_valuation_rupees:
          type: integer
          format: int64
        future_valuation_rupees:
          type: integer
          format: int64
        future_valuation_year:
          type: integer
        verdict:
          type: string
        compared_parcel_id:
          type: string
          format: uuid
          nullable: true
        margin_pct:
          type: number
          nullable: true
        infrastructure_note:
          type: string
        comparable_sales_note:
          type: string

    FeasibilityAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        land_parcel_id:
          type: string
          format: uuid
        current_valuation_rupees:
          type: integer
          format: int64
        future_valuation_rupees:
          type: integer
          format: int64
        future_valuation_year:
          type: integer
        verdict:
          type: string
        compared_parcel_id:
          type: string
          format: uuid
          nullable: true
        margin_pct:
          type: number
          nullable: true
        infrastructure_note:
          type: string
        comparable_sales_note:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PlannedInfrastructureList:
      type: object
      properties:
        location:
          nullable: true
          description: where the app resolved the parcel's free-text location to; null when it couldn't
          type: object
          properties:
            display_name:
              type: string
            matched_query:
              type: string
              description: the text that actually matched — shorter than the parcel's location when only part of it was found
            latitude:
              type: number
            longitude:
              type: number
        radius_km:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlannedInfrastructureItem"
        coverage:
          nullable: true
          description: >-
            Present when nothing on the list is measured within radius_km. The area (~5 km cell) is
