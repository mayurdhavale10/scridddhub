openapi: 3.1.0
info:
  title: ScridddHub API
  version: 0.1.0
  description: >
    Source of truth for the TypeScript client generated into packages/api-client.
    Covers only what's implemented so far (Level 1: Land Parcels vertical slice).
servers:
  - url: http://localhost:8080

paths:
  /projects:
    post:
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"

  /projects/{id}:
    get:
      operationId: getProject
      summary: Get a project by id
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectID}/land-parcels:
    get:
      operationId: listLandParcelsByProject
      summary: List land parcels for a project
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LandParcel"

  /reference/geography/districts:
    get:
      operationId: listGeographyDistricts
      summary: All 36 real Maharashtra districts (docs/adr/0006) — from the government's own Common Village Master API, not just districts with a Ready Reckoner rate on file
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringList"

  /reference/geography/talukas:
    get:
      operationId: listGeographyTalukas
      summary: Real talukas within a district (docs/adr/0006)
      parameters:
        - name: district
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringList"

  /reference/geography/villages:
    get:
      operationId: listGeographyVillages
      summary: Real villages within a district+taluka (docs/adr/0006) — all 44,918 statewide, not just villages with a rate on file
      parameters:
        - name: district
          in: query
          required: true
          schema:
            type: string
        - name: taluka
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringList"

  /reference/geography/villages/search:
    get:
      operationId: searchGeographyVillages
      summary: Free-text village search across all 44,918 real Maharashtra villages (docs/adr/0006 follow-up) — powers a single search field instead of three cascading district/taluka/village pickers; each result carries its full district/taluka/village context
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VillageMatchList"

  /land-parcels/estimate-value/ai:
    get:
      operationId: estimateParcelValueAI
      summary: UNVERIFIED LLM-based market estimate (Groq) — never equivalent to the government-data-backed /land-parcels/estimate-value; Confidence is always "low"
      description: >-
        Always asks the LLM. If district/taluka/village name a real village with a Ready Reckoner
        rate on file, the server looks that rate up itself and gives it to the model as a floor;
        otherwise the model works from location, area, source and notes alone.
      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
        - name: area_acres
          in: query
          required: true
          schema:
            type: number
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: notes
          in: query
          required: false
          description: user's free-text notes about the plot (truncated to 1000 characters)
          schema:
            type: string
        - name: district
          in: query
          required: false
          schema:
            type: string
        - name: taluka
          in: query
          required: false
          schema:
            type: string
        - name: village
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AILandValueEstimate"

  /land-parcels/estimate-value:
    get:
      operationId: estimateParcelValue
      summary: On-demand, standalone location-based value estimate (Screen 4.2 "Estimate Value")
      description: >-
        Called only when whoever is adding a parcel doesn't already know the price — never
        automatic. Grounded entirely in this location's own government-published Ready Reckoner
        Rate (Maharashtra e-ASR); NEVER a comparison against other parcels recorded anywhere in
        this app, at any scope (see docs/adr/0004). 404s honestly if no rate is on file yet for
        this exact village, rather than fabricating a number.
      parameters:
        - name: district
          in: query
          required: true
          schema:
            type: string
        - name: taluka
          in: query
          required: true
          schema:
            type: string
        - name: village
          in: query
          required: true
          schema:
            type: string
        - name: area_acres
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationValueEstimate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /land-parcels:
    post:
      operationId: createLandParcel
      summary: Create a land parcel (Screen 4 "+" action)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLandParcelRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandParcel"
        "400":
          $ref: "#/components/responses/BadRequest"

  /land-parcels/{id}:
    get:
      operationId: getLandParcel
      summary: Get a land parcel by id (Screen 5 detail)
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandParcel"
        "404":
          $ref: "#/components/responses/NotFound"

  /land-parcels/{id}/stage:
    patch:
      operationId: updateLandParcelStage
      summary: Move a land parcel to a new pipeline stage
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  $ref: "#/components/schemas/LandParcelStage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandParcel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /land-parcels/{id}/verify-source:
    post:
      operationId: verifyLandParcelSource
      summary: On-demand reachability check against the parcel's own recorded source_url (never a content scrape; never runs automatically)
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifySourceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /land-parcels/{id}/close:
    post:
      operationId: recordLandParcelClosedPrice
      summary: Record the real, final transacted price once a deal actually closes (docs/adr/0005)
      description: >-
        Distinct from the parcel's asking price (cost_rupees), which is captured once at creation
        and never re-verified. This is the only legitimate ground truth for a future pricing
        model — see services/estimatedparcelvalue/README.md.
      parameters:
        - $ref: "#/components/parameters/LandParcelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [closed_price_rupees]
              properties:
                closed_price_rupees:
                  type: integer
                  format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandParcel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /reference/pricing-pool/closed-transactions:
    get:
      operationId: listPooledClosedTransactions
      summary: Real closed transactions pooled across every org/project (docs/adr/0005) — not wired to any UI yet
      description: >-
        Infrastructure for a future pricing model, built ahead of having enough volume to train
        one. Deliberately anonymized (no org/project/parcel identity) and never scoped to a single
        project — see docs/adr/0005 for why.
      parameters:
        - name: district
          in: query
          required: true
          schema:
            type: string
        - name: taluka
          in: query
          required: true
          schema:
            type: string
        - name: village
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListClosedTransactionsResponse"

  /land-parcels/{parcelID}/feasibility-assessment:
    put:
      operationId: upsertFeasibilityAssessment
      summary: Set (create or replace) a parcel's feasibility assessment (Screen 5)
      parameters:
        - name: parcelID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertFeasibilityAssessmentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeasibilityAssessment"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: getFeasibilityAssessment
      summary: Get a parcel's feasibility assessment (Screen 5)
      parameters:
        - name: parcelID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeasibilityAssessment"
        "404":
          $ref: "#/components/responses/NotFound"

  /land-parcels/{parcelID}/planned-infrastructure:
    get:
      operationId: getPlannedInfrastructure
      summary: Approved infrastructure projects near a parcel (Screen 5)
      description: >-
        From the shared reference list (migrations 000028/000029; approved projects only). The
        parcel's free-text location is geocoded (cached); projects with located stations are matched
        by straight-line distance within radius_km, nearest first. Projects without located points
        fall back to taluka matching (match_basis says which). An empty list means nothing on the
        list is near it, not that nothing is planned.
      parameters:
        - name: parcelID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannedInfrastructureList"
        "404":
          $ref: "#/components/responses/NotFound"

  /reference/planned-infrastructure:
    get:
      operationId: getPlannedInfrastructureForLocation
      summary: Approved infrastructure near any typed location — no parcel needed (see services/plannedinfrastructure)
      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
        - name: district
          in: query
          required: false
          description: only used together with taluka, when the location was picked from the real village list
          schema:
            type: string
        - name: taluka
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannedInfrastructureList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /land-parcels/{parcelID}/legal-check:
    put:
      operationId: upsertLegalCheck
      summary: Set (create or replace) a parcel's legal & RERA check (Screen 6)
      parameters:
        - name: parcelID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertLegalCheckRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: getLegalCheck
      summary: Get a parcel's legal & RERA check (Screen 6)
      parameters:
        - name: parcelID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCheck"
        "404":
          $ref: "#/components/responses/NotFound"

  /land-parcels/{parcelID}/approvals/analyze:
    post:
      operationId: analyzeProjectForApprovals
      summary: >
        Extract site characteristics from free text and (re)generate the parcel's government
        approval list (Screen 7 "Tell Us About Your Project" / "Re-analyze")
      parameters:
        - name: parcelID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [free_text]
              properties:
                free_text:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LandParcelApproval"
        "400":
          $ref: "#/components/responses/BadRequest"

  /land-parcels/{parcelID}/approvals:
    get:
      operationId: listApprovals
      summary: List a parcel's government approvals (Screen 7)
      parameters:
        - name: parcelID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LandParcelApproval"

  /land-parcels/{parcelID}/site-summary:
    get:
      operationId: getSiteSummary
      summary: Get the parcel's saved project-summary free text + extracted characteristics
      parameters:
        - name: parcelID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /approvals/{approvalID}/status:
    patch:
      operationId: updateApprovalStatus
      summary: Manually update one approval's status (e.g. a department responds)
      parameters:
        - name: approvalID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/ApprovalStatus"
                submitted_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandParcelApproval"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectID}/land-tenure:
    put:
      operationId: upsertLandTenure
      summary: Set (create or replace) a project's land tenure / JDA structure (Screen 8.9)
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertLandTenureRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandTenure"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: getLandTenure
      summary: Get a project's land tenure / JDA structure (Screen 8.9)
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandTenure"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectID}/financial-structure:
    put:
      operationId: upsertFinancialStructure
      summary: Set (create or replace) a project's Sources & Uses summary (Screen 8)
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertFinancialStructureRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialStructure"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: getFinancialStructure
      summary: Get a project's Sources & Uses summary (Screen 8)
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialStructure"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectID}/escrow-account:
    get:
      operationId: getEscrowAccount
      summary: Get a project's escrow account (Screen 8.10) — bank-verified vs. developer ledger
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscrowAccount"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectID}/escrow-account/developer-ledger:
    put:
      operationId: updateEscrowDeveloperLedger
      summary: Update the developer's own self-reported escrow ledger figure
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [balance_rupees]
              properties:
                balance_rupees:
                  type: integer
                  format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscrowAccount"
        "400":
          $ref: "#/components/responses/BadRequest"

  /projects/{projectID}/escrow-account/bank-feed:
    put:
      operationId: updateEscrowBankFeed
      summary: >
        Update the bank-verified escrow balance. For a real bank statement-fetch integration to
        call (a scheduled job or webhook) — not intended for the mobile app's own UI.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [balance_rupees, source_name]
              properties:
                balance_rupees:
                  type: integer
                  format: int64
                source_name:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscrowAccount"
        "400":
          $ref: "#/components/responses/BadRequest"

  /projects/{projectID}/certification-packets:
    post:
      operationId: createCertificationPacket
      summary: Create a quarterly certification packet (Screen 8.4) — also creates its 3 empty sub-drafts
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period_year, period_quarter]
              properties:
                period_year:
                  type: integer
                period_quarter:
                  type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificationPacket"
        "400":
          $ref: "#/components/responses/BadRequest"

  /projects/{projectID}/certification-packets/{year}/{quarter}:
    get:
      operationId: getCertificationPacket
      summary: Get a quarterly certification packet with all 3 sub-drafts (Screen 8.4)
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: year
          in: path
          required: true
          schema:
            type: integer
        - name: quarter
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificationPacket"
        "404":
          $ref: "#/components/responses/NotFound"

  /certification-packets/{packetID}/send-to-professionals:
    post:
      operationId: sendCertificationPacketToProfessionals
      summary: Send the packet's drafts to the Engineer & CA for review
      parameters:
        - $ref: "#/components/parameters/PacketId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificationPacket"
        "404":
          $ref: "#/components/responses/NotFound"

  /certification-packets/{packetID}/engineer-draft:
    put:
      operationId: upsertEngineerDraft
      summary: Set the Engineer's cost-incurred draft (Screen 8.4.1)
      parameters:
        - $ref: "#/components/parameters/PacketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cost_by_tower:
                  type: array
                  items:
                    $ref: "#/components/schemas/TowerCost"
                committed_not_reflected_rupees:
                  type: integer
                  format: int64
                  nullable: true
                source_note:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificationPacket"
        "404":
          $ref: "#/components/responses/NotFound"

  /certification-packets/{packetID}/engineer-draft/sign:
    post:
      operationId: signEngineerDraft
      summary: Engineer's legal certification of the cost-incurred draft
      parameters:
        - $ref: "#/components/parameters/PacketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificationPacket"
        "400":
          $ref: "#/components/responses/BadRequest"

  /certification-packets/{packetID}/architect-certificate/schedule-site-visit:
    post:
      operationId: scheduleArchitectSiteVisit
      summary: Record that a site visit has been scheduled (no AI-draft path exists for this entity)
      parameters:
        - $ref: "#/components/parameters/PacketId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificationPacket"
        "404":
          $ref: "#/components/responses/NotFound"

  /certification-packets/{packetID}/architect-certificate/complete-site-visit:
    post:
      operationId: completeArchitectSiteVisit
      summary: Record that the site visit happened — required before certification is possible
      parameters:
        - $ref: "#/components/parameters/PacketId"
      responses:
        "200":
          description: OK
