      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        trade_package:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenderBidTechnicalStatus:
      type: string
      enum: [qualified, disqualified, pending]

    CreateTenderBidRequest:
      type: object
      required:
        - contractor_name
      properties:
        contractor_name:
          type: string
        past_jobs_with_developer:
          type: integer
        past_performance_note:
          type: string
        technical_bid_status:
          $ref: "#/components/schemas/TenderBidTechnicalStatus"
        financial_bid_rupees:
          type: integer
          format: int64
          nullable: true
        recommended:
          type: boolean

    UpdateTenderBidRequest:
      type: object
      required:
        - technical_bid_status
      properties:
        technical_bid_status:
          $ref: "#/components/schemas/TenderBidTechnicalStatus"
        financial_bid_rupees:
          type: integer
          format: int64
          nullable: true
        recommended:
          type: boolean

    TenderBid:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tender_id:
          type: string
          format: uuid
        contractor_name:
          type: string
        past_jobs_with_developer:
          type: integer
        past_performance_note:
          type: string
        technical_bid_status:
          $ref: "#/components/schemas/TenderBidTechnicalStatus"
        financial_bid_rupees:
          type: integer
          format: int64
          nullable: true
        recommended:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MasterScheduleMilestoneType:
      type: string
      enum:
        - land_acquisition
        - approvals
        - construction_start
        - structure_complete
        - committed_possession_date

    MasterScheduleMilestoneStatus:
      type: string
      enum: [complete, in_progress, pending]

    CreateMilestoneRequest:
      type: object
      required:
        - milestone_type
        - status
        - target_date
      properties:
        milestone_type:
          $ref: "#/components/schemas/MasterScheduleMilestoneType"
        status:
          $ref: "#/components/schemas/MasterScheduleMilestoneStatus"
        target_date:
          type: string
          format: date

    CreateMasterScheduleRequest:
      type: object
      required:
        - milestones
      properties:
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/CreateMilestoneRequest"

    UpdateMasterScheduleMilestoneRequest:
      type: object
      required:
        - status
        - target_date
      properties:
        status:
          $ref: "#/components/schemas/MasterScheduleMilestoneStatus"
        target_date:
          type: string
          format: date

    MasterScheduleMilestone:
      type: object
      properties:
        id:
          type: string
          format: uuid
        milestone_type:
          $ref: "#/components/schemas/MasterScheduleMilestoneType"
        status:
          $ref: "#/components/schemas/MasterScheduleMilestoneStatus"
        target_date:
          type: string
          format: date

    MasterSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/MasterScheduleMilestone"

    AuditLogEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        table_name:
          type: string
        row_id:
          type: string
          format: uuid
        action:
          type: string
          enum: [insert, update, delete]
        actor:
          type: string
        old_data:
          type: object
          nullable: true
          additionalProperties: true
        new_data:
          type: object
          nullable: true
          additionalProperties: true
        changed_at:
          type: string
          format: date-time

    StringList:
      type: object
      properties:
        values:
          type: array
          items:
            type: string

    AILandValueEstimate:
      type: object
      properties:
        location:
          type: string
        area_acres:
          type: number
        estimated_rate_per_acre_rupees:
          type: integer
          format: int64
        estimated_total_value_rupees:
          type: integer
          format: int64
        reasoning:
          type: string
        confidence:
          type: string
        model:
          type: string
        generated_at:
          type: string
          format: date-time
        used_ready_reckoner_rate:
          type: boolean
          description: true when the model was given this village's government Ready Reckoner rate (looked up server-side) as a grounding floor

    VillageMatchList:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              district:
                type: string
              taluka:
                type: string
              village:
                type: string

    LocationValueEstimate:
      type: object
      properties:
        district:
          type: string
        taluka:
          type: string
        village:
          type: string
        zone_no:
          type: string
        rate_per_sqm_rupees:
          type: integer
          format: int64
        effective_year:
          type: string
        source_url:
          type: string
        verified_at:
          type: string
          format: date-time
        area_sqm:
          type: number
        estimated_value_rupees:
          type: integer
          format: int64
