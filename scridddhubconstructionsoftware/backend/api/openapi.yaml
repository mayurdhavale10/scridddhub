          in: query
          required: true
          schema:
            type: string
        - name: district
          in: query
          required: false
          description: only used together with taluka, when the location was picked from the real village list
          schema:
            type: string
        - name: taluka
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannedInfrastructureList"
        "400":
          $ref: "#/components/responses/BadRequest"

